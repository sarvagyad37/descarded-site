name = "descarded"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# D1 — source of truth for Presale/Artists form submissions.
# Google Sheets remains an operational mirror, synced in the background
# after a D1 write succeeds (see functions/api/_store.js).
#
# database_id below points at the real production database
# (descarded-prod). `wrangler pages dev` / `wrangler d1 migrations apply
# DB --local` still only ever touch the local sqlite file under
# .wrangler/state and never send anything to this id.
#
# Migrations have been applied remotely (0001_init.sql). The Pages
# project still needs the `DB` binding added in the dashboard (Settings
# → Functions → D1 database bindings) before a deploy can use it — see
# docs/PRODUCTION_ACTIVATION_CHECKLIST.md for the remaining steps.
[[d1_databases]]
binding = "DB"
database_name = "descarded-prod"
database_id = "fcc3ba3a-86d1-4fff-9fb4-aaba30d2c0b8"
migrations_dir = "migrations"
